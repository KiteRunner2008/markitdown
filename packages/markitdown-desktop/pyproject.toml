[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-desktop"
version = "0.1.1"
description = "Desktop GUI for MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "MarkItDown Desktop contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications :: Qt",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "markitdown[xlsx,xls]",
  "PySide6==6.10.1",
]

[project.optional-dependencies]
package = [
  "pyinstaller>=6.0",
]

[project.scripts]
markitdown-desktop = "markitdown_desktop.app:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_desktop", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_desktop"]
